<!doctype html>
<html lang="ja">
<head>

<title>Super Scheduler</title>
<style>
:root{--bg:#f5f4f0;--paper:#fff;--ink:#20241f;--muted:#858a80;--line:#e9e9e2;--green:#47745b;--mint:#e7f0e9;--orange:#f1a875;--shadow:0 12px 32px #2631260c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;min-height:100vh;padding:20px 28px}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 22px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:19px}.logo{width:38px;height:38px;border-radius:13px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:21px}.topright{display:flex;align-items:center;gap:12px}.today-pill{font-size:13px;color:var(--muted);background:#fff;padding:10px 15px;border-radius:30px}.iconbtn,.btn{border:0;border-radius:12px;padding:11px 15px;background:#fff;color:var(--ink);box-shadow:var(--shadow)}.btn.primary{background:var(--green);color:#fff;font-weight:650}.btn.soft{background:var(--mint);color:var(--green)}.layout{display:grid;grid-template-columns:250px minmax(400px,1fr) 305px;gap:20px}.panel{background:var(--paper);border:1px solid #eeeee8;border-radius:20px;box-shadow:var(--shadow)}.side{padding:20px;height:max-content}.profile{display:flex;align-items:center;gap:11px;padding:2px 0 22px;border-bottom:1px solid var(--line)}.avatar{width:40px;height:40px;border-radius:14px;background:#f5e4d4;display:grid;place-items:center;font-size:21px}.profile b{font-size:14px}.profile small{display:block;color:var(--muted);margin-top:3px}.nav{padding:17px 0;border-bottom:1px solid var(--line)}.nav-item{padding:11px 12px;border-radius:11px;color:#6c716a;font-size:14px;display:flex;gap:12px;align-items:center;cursor:pointer;margin:3px 0}.nav-item.active{background:var(--mint);color:var(--green);font-weight:650}.nav-item span{font-size:17px;width:20px}.side h4,.right h4{font-size:12px;color:#9a9e97;letter-spacing:.08em;margin:20px 10px 10px}.mini-date{font-size:12px;color:var(--muted);padding:10px;line-height:1.8}.mini-row{display:flex;justify-content:space-between}.mini-row strong{color:var(--ink)}.filter{display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:13px;color:#62675f}.dot{width:9px;height:9px;border-radius:50%;background:#76a88b}.dot.orange{background:#e99d65}.dot.blue{background:#7f9ac4}.center{min-width:0}.welcome{padding:23px 25px;margin-bottom:16px;background:linear-gradient(120deg,#e5efe7,#f5f6ef);border:0;position:relative;overflow:hidden}.welcome h1{font-size:23px;margin:0 0 6px;letter-spacing:-.03em}.welcome p{color:#647267;font-size:13px;margin:0}.welcome .sun{position:absolute;right:35px;top:-17px;font-size:96px;opacity:.8}.calendar{padding:22px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.cal-head h2{font-size:19px;margin:0}.cal-controls{display:flex;gap:7px;align-items:center}.cal-controls button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;color:#60655d}.cal-controls .selected{background:var(--green);color:#fff;border-color:var(--green)}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);padding-bottom:10px}.week div{text-align:center;color:#9b9f98;font-size:11px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}.day{min-width:0;overflow:hidden;min-height:92px;padding:7px 5px;border-radius:11px;border:1px solid transparent;cursor:pointer}.day:hover{background:#f8f9f6}.day.faded{opacity:.4}.day.selected-day{background:#eef5ef;border-color:#dce9de}.day .n{font-size:12px;color:#4d524b;display:inline-grid;place-items:center;width:24px;height:24px}.day.today .n{background:var(--green);color:white;border-radius:50%}.event{display:block;min-width:0;max-width:100%;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 5px;border-radius:5px;margin-top:4px;background:#e8f1e9;color:#50745b}.event.orange{background:#fbefe5;color:#b37448}.event.blue{background:#eaf0f8;color:#60799f}.agenda{padding:18px 22px;margin-top:16px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section-title h3{font-size:15px;margin:0}.section-title small{font-size:12px;color:var(--muted)}.agenda-row{display:grid;grid-template-columns:64px 4px 1fr auto;gap:12px;align-items:stretch;padding:9px 0}.time{font-size:12px;color:#8d928a;padding-top:4px}.bar{background:#78a184;border-radius:8px}.bar.orange{background:#e99d65}.entry{padding:1px 0}.entry b{font-size:13px;font-weight:650}.entry small{display:block;color:#989c95;font-size:11px;margin-top:4px}.right{display:flex;flex-direction:column;gap:15px}.right .panel{padding:19px}.quick{background:#fff}.quick h3{font-size:15px;margin:0 0 15px}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick-actions button{border:0;border-radius:12px;padding:13px 8px;background:#f6f7f3;color:#535a50;font-size:12px;text-align:left}.quick-actions i{font-style:normal;font-size:18px;display:block;margin-bottom:7px}.focus{background:#f3eee5!important}.focus strong{font-size:26px}.focus p{font-size:12px;color:#807a6d;margin:7px 0 0}.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.task:last-child{border:0}.task input{accent-color:var(--green);margin-top:2px}.task small{display:block;color:#9b9e97;margin-top:4px}.task.done span{text-decoration:line-through;color:#a5a8a1}.modal-bg{display:none;position:fixed;inset:0;background:#15201666;z-index:5;align-items:center;justify-content:center;padding:16px}.modal-bg.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 70px #0003;max-height:90vh;overflow:auto}.modal h2{font-size:19px;margin:0 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#747a71}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;outline-color:#91b49a}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:13px;background:#24382c;color:white;font-size:13px;box-shadow:var(--shadow);display:none;z-index:9}.scanbox{border:1px dashed #cbd4ca;border-radius:12px;padding:16px;text-align:center;color:#777;font-size:12px}.scanbox img{max-width:100%;max-height:200px;display:none;margin:12px auto;border-radius:9px}.ocrnote{font-size:11px;color:#959a92;line-height:1.6;margin-top:8px}.mobile-nav{display:none}
@media(max-width:1100px){.layout{grid-template-columns:220px minmax(0,1fr)}.right{grid-column:2;display:grid;grid-template-columns:1fr 1fr}.right .quick{grid-column:1/-1}.day{min-height:76px}}
@media(max-width:820px){.top{flex-wrap:wrap;gap:10px}.topright{width:100%;justify-content:space-between;flex-wrap:wrap}.layout{grid-template-columns:1fr}.side{display:none}.right{grid-column:auto;display:grid;grid-template-columns:1fr 1fr}.right .quick{grid-column:1/-1}}
@media(max-width:720px){.app{padding:12px}.top{padding:6px 2px 14px}.brand{font-size:16px}.today-pill{display:none}.layout{display:flex;flex-direction:column;gap:12px}.side{display:none}.welcome{padding:19px}.welcome h1{font-size:20px}.welcome .sun{right:15px;font-size:72px;top:-8px}.calendar{padding:15px 10px}.cal-head{align-items:flex-start;gap:10px;flex-direction:column}.cal-head h2{font-size:17px}.cal-controls{width:100%;justify-content:flex-end}.day{min-height:62px;padding:4px 2px}.day .n{width:22px;height:22px}.event{font-size:8px;padding:3px}.agenda{padding:15px}.right{display:flex}.right .quick{order:0}.quick-actions button{padding:10px}.mobile-nav{display:flex;position:sticky;bottom:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:7px;justify-content:space-around;box-shadow:0 8px 25px #0001;z-index:3}.mobile-nav button{border:0;background:none;color:#777;font-size:10px}.mobile-nav span{display:block;font-size:18px;margin-bottom:3px}.formgrid{grid-template-columns:1fr 1fr}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="logo">✦</div>Super Scheduler</div><div class="topright"><span class="today-pill" id="todayLabel"></span><button class="btn soft" id="notifyBtn">🔔 通知を設定</button><button class="btn soft" id="topCamera" onclick="document.getElementById(&apos;scanModal&apos;).classList.add(&apos;open&apos;)">📷 カメラ撮影</button><button class="btn primary" id="topAdd">＋ 予定を追加</button></div></header>
<div class="layout"><aside class="panel side"><div class="profile"><div class="avatar">🌿</div><div><b>マイ スケジュール</b><small>今日もいい一日に</small></div></div><div class="nav"><div class="nav-item active"><span>▦</span>カレンダー</div><div class="nav-item" id="tasksNav"><span>☑</span>タスク</div><div class="nav-item" id="scanNav"><span>▧</span>カメラ・プリントをスキャン</div></div><h4>ミニカレンダー</h4><div class="mini-date" id="miniDate"></div><h4>カレンダー</h4><div class="filter"><i class="dot"></i>予定</div><div class="filter"><i class="dot orange"></i>タスク</div><div class="filter"><i class="dot blue"></i>リマインダー</div><button class="btn" style="width:100%;margin-top:18px" id="exportBtn">⬇ データを書き出す</button><button class="btn" style="width:100%;margin-top:8px" id="importBtn">⬆ データを読み込む</button><input type="file" id="importFile" accept="application/json" hidden></aside>
<main class="center"><section class="panel welcome"><h1 id="greeting">おかえりなさい 👋</h1><p>今日の予定を確認して、心地よい一日を。</p><div class="sun">☀️</div></section><section class="panel calendar"><div class="cal-head"><h2 id="monthTitle"></h2><div class="cal-controls"><button id="prevMonth">‹</button><button id="todayBtn">今日</button><button id="nextMonth">›</button><button class="selected">月</button><button id="weekMode">週</button></div></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="days" id="days"></div></section><section class="panel agenda"><div class="section-title"><h3 id="agendaTitle">今日の予定</h3><small id="agendaCount"></small></div><div id="agendaList"></div></section></main>
<aside class="right"><section class="panel quick"><h3>クイックアクション</h3><div class="quick-actions"><button id="quickEvent"><i>✚</i>予定を追加</button><button id="quickTask"><i>☑</i>タスクを追加</button><button id="quickScan"><i>📷</i>プリントを読み取る</button><button id="quickText"><i>✎</i>文章から予定作成</button></div></section><section class="panel focus"><h4 style="margin:0 0 10px;color:#898575">今日のフォーカス</h4><strong id="focusCount">0</strong><p>件の予定を入れています。余白も大切に 🌱</p></section><section class="panel"><div class="section-title"><h3>やること</h3><button class="iconbtn" id="addTaskSmall">＋</button></div><div id="taskList"></div></section></aside></div><nav class="mobile-nav"><button><span>▦</span>カレンダー</button><button id="mobileTasks"><span>☑</span>タスク</button><button id="mobileAdd"><span>＋</span>追加</button><button id="mobileScan"><span>📷</span>スキャン</button></nav></div>
<div class="modal-bg" id="eventModal"><div class="modal"><h2 id="modalTitle">予定を追加</h2><form id="eventForm"><div class="formgrid"><div class="field full"><label>予定名</label><input name="title" required placeholder="例：チームミーティング"></div><div class="field"><label>日付</label><input name="date" type="date" required></div><div class="field"><label>開始時刻</label><input name="time" type="time" value="09:00"></div><div class="field"><label>終了時刻</label><input name="end" type="time" value="10:00"></div><div class="field"><label>種類</label><select name="category"><option value="event">予定</option><option value="task">タスク</option><option value="reminder">リマインダー</option></select></div><div class="field full"><label>場所・メモ</label><input name="note" placeholder="場所や持ち物など"></div><div class="field"><label>通知</label><select name="remind"><option value="0">通知なし</option><option value="5">5分前</option><option value="10" selected>10分前</option><option value="30">30分前</option><option value="60">1時間前</option><option value="1440">前日</option></select></div><div class="field"><label>所要時間（分）</label><input name="duration" type="number" min="5" step="5" value="60"></div></div><div class="modal-actions"><button type="button" class="btn" data-close>キャンセル</button><button class="btn primary">保存する</button></div></form></div></div>
<div class="modal-bg" id="scanModal"><div class="modal"><h2>📷 プリントから予定を作る</h2><div class="field"><label>プリントや案内を撮影・選択</label><div class="scanbox"><input type="file" id="scanFile" accept="image/*,.pdf" capture="environment"><img id="scanPreview"><div class="ocrnote">画像を読み込んだら文字を下の欄に貼り付けてください。日付や時間を検出して、予定候補を作成します。</div></div></div><div class="field"><label>読み取った文字（OCRテキスト）</label><textarea id="scanText" rows="5" placeholder="例：10月28日（水） 14:00 保護者会\n持ち物：筆記用具"></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close>閉じる</button><button type="button" class="btn primary" id="parseText">予定候補を作る</button></div></div></div>
<div class="modal-bg" id="textModal"><div class="modal"><h2>✎ 文章から予定を作る</h2><div class="field"><label>予定の内容</label><textarea id="naturalText" rows="4" placeholder="例：10月30日 15時から歯医者、30分前に通知"></textarea></div><div class="modal-actions"><button type="button" class="btn" data-close>キャンセル</button><button type="button" class="btn primary" id="parseNatural">候補を作成</button></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);let events=JSON.parse(localStorage.getItem('superSchedulerEvents')||'[]'),tasks=JSON.parse(localStorage.getItem('superSchedulerTasks')||'[]'),viewDate=new Date(),selectedDate=iso(new Date()),timers=[];function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function save(){localStorage.setItem('superSchedulerEvents',JSON.stringify(events));localStorage.setItem('superSchedulerTasks',JSON.stringify(tasks));render()}function labelDate(d){return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(d)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.display='none',2800)}function render(){let y=viewDate.getFullYear(),m=viewDate.getMonth();$('#monthTitle').textContent=`${y}年 ${m+1}月`;$('#todayLabel').textContent=labelDate(new Date());$('#miniDate').innerHTML=`<div style="font-size:14px;color:#333;margin-bottom:4px">${y}年 ${m+1}月</div><div class="mini-row"><span>今月の予定</span><strong>${events.filter(e=>e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).length}件</strong></div><div class="mini-row"><span>未完了タスク</span><strong>${tasks.filter(t=>!t.done).length}件</strong></div>`;let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=iso(d),items=events.filter(e=>e.date===ds);html+=`<div class="day ${d.getMonth()!==m?'faded':''} ${ds===iso(new Date())?'today':''} ${ds===selectedDate?'selected-day':''}" data-date="${ds}"><span class="n">${d.getDate()}</span>${items.slice(0,2).map(e=>`<div class="event ${e.category==='task'?'orange':e.category==='reminder'?'blue':''}">${esc(e.time||'')} ${esc(e.title)}   if(!search)return;
  const $=selector=>document.querySelector(selector);
  const eventKey='superSchedulerEvents',taskKey='superSchedulerTasks';
  const aliases=[
    ['ドルフィンズ','ドルフィン','ダイヤモンドドルフィンズ','名古屋ダイヤモンドドルフィンズ','名古屋ダイヤモンド','名古屋d','diamond dolphins','dolphins','nagoya dolphins','nagoya diamond dolphins','ndd']
  ];
  const normalize=value=>String(value||'').normalize('NFKC').toLocaleLowerCase().replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/\s+/g,' ').trim();
  function editDistance(a,b,limit){
    if(Math.abs(a.length-b.length)>limit)return limit+1;
    const prev=Array.from({length:b.length+1},(_,i)=>i);
    for(let i=1;i<=a.length;i++){let diag=prev[0];prev[0]=i;let rowMin=prev[0];for(let j=1;j<=b.length;j++){const old=prev[j];prev[j]=Math.min(prev[j]+1,prev[j-1]+1,diag+(a[i-1]===b[j-1]?0:1));diag=old;rowMin=Math.min(rowMin,prev[j])}if(rowMin>limit)return limit+1}
    return prev[b.length]
  }
  function planFor(query){
    let rest=normalize(query);const groups=[];
    for(const group of aliases){
      const candidates=group.slice().sort((a,b)=>b.length-a.length);
      const found=candidates.find(alias=>rest.includes(alias))||candidates.find(alias=>/^[a-z ]+$/.test(alias)&&rest.split(/\s+/).some(word=>word.length>=5&&editDistance(word,alias.replace(/\s+/g,''),1)<=1));
      if(found){groups.push(group);rest=rest.replace(found,' ');if(found==='diamond dolphins'||found==='nagoya dolphins'||found==='nagoya diamond dolphins')rest=rest.replace(/^(?:diamond|nagoya|dolphins)\s*/,' ')}
    }
    rest=rest.replace(/(?:の)?(?:試合|予定|日程|スケジュール|イベント|チーム|対戦|観戦|ゲーム|game|games)/gi,' ');
    const terms=rest.replaceAll('/',' ').replace(/[、。,:;／・|(){}]+/g,' ').split(/\s+/).filter(Boolean);
    return{groups,terms,query:normalize(query)}
  }
  function itemText(item){
    const date=item.date||'',time=item.time||'',title=item.title||item.name||'';
    let dateText=date;
    if(/^\d{4}-\d{2}-\d{2}$/.test(date)){const d=new Date(date+'T12:00:00');dateText+=' '+(d.getMonth()+1)+'月'+d.getDate()+'日 '+['日','月','火','水','木','金','土'][d.getDay()]+'曜日 '+(d.getMonth()+1)+'/'+d.getDate()}
    const times=[time,item.end].filter(x=>/^\d{2}:\d{2}$/.test(x||'')).map(x=>x+' '+Number(x.slice(0,2))+'時'+x.slice(3)+'分').join(' ');
    const category=item.category==='task'?'タスク':item.category==='reminder'?'リマインダー':'予定';
    return normalize([title,item.name,item.note,item.location,item.place,item.category,category,item.done?'完了':'未完了',dateText,times].filter(Boolean).join(' '))
  }
  function matches(item,plan){
    const text=itemText(item);
    if(!plan.groups.every(group=>group.some(alias=>text.includes(normalize(alias)))))return false;
    return plan.terms.every(term=>{
      if(text.includes(term))return true;
      if(/^[a-z]{5,}$/.test(term)){const words=text.match(/[a-z]{5,}/g)||[];return words.some(word=>editDistance(term,word,1)<=1)}
      if(/^\d{1,2}月$/.test(term)){const month=Number(term.slice(0,-1));return text.includes(month+'月')}
      return false
    })
  }
  function readItems(){
    let events=[],tasks=[];
    try{events=JSON.parse(localStorage.getItem(eventKey)||'[]');if(!Array.isArray(events))events=[]}catch{}
    try{tasks=JSON.parse(localStorage.getItem(taskKey)||'[]');if(!Array.isArray(tasks))tasks=[]}catch{}
    const list=events.map(item=>({...item,_source:'event'}));
    for(const task of tasks)list.push({...task,title:task.title||task.name||'タスク',category:'task',_source:'task'});
    const today=new Date();today.setHours(0,0,0,0);const todayString=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    return list.sort((a,b)=>{
      const ad=a.date||'9999-99-99',bd=b.date||'9999-99-99',af=ad>=todayString,bf=bd>=todayString;
      if(af!==bf)return af?-1:1;
      if(ad!==bd)return af?ad.localeCompare(bd):bd.localeCompare(ad);
      return String(a.time||'').localeCompare(String(b.time||''))
    })
  }
  const controls=search.parentElement;controls.style.position='relative';search.placeholder='予定を検索';search.setAttribute('aria-label','全予定を検索');search.setAttribute('aria-autocomplete','list');
  const popup=document.createElement('div');popup.setAttribute('role','listbox');popup.style.cssText='display:none;position:absolute;z-index:100;top:calc(100% + 8px);right:0;width:min(430px,calc(100vw - 36px));max-height:58vh;overflow:auto;background:#fff;border:1px solid #e8ebe6;border-radius:14px;box-shadow:0 14px 40px #26372a26;padding:8px';
  controls.append(popup);
  let results=[];
  function appendHeader(count){const head=document.createElement('div');head.textContent='検索結果 '+count+'件 · チーム名・日付・場所でも検索できます';head.style.cssText='padding:8px 10px 10px;color:#748077;font-size:12px;font-weight:700';popup.append(head)}
  function renderResults(){
    const value=search.value.trim();popup.replaceChildren();if(!value){popup.style.display='none';return}
    const plan=planFor(value);results=readItems().filter(item=>matches(item,plan));appendHeader(results.length);
    if(!results.length){const empty=document.createElement('div');empty.textContent='一致する予定はありません。チーム名・日付・場所でも検索できます。';empty.style.cssText='padding:12px;color:#858d87;font-size:13px;line-height:1.6';popup.append(empty);popup.style.display='block';return}
    for(let i=0;i<results.length;i++){
      const item=results[i],button=document.createElement('button');button.type='button';button.setAttribute('role','option');button.dataset.index=String(i);
      button.style.cssText='display:block;width:100%;text-align:left;border:0;border-radius:10px;background:#fff;padding:10px;cursor:pointer;color:#24382c';
      button.onmouseenter=()=>button.style.background='#f2f6f2';button.onmouseleave=()=>button.style.background='#fff';
      const title=document.createElement('strong');title.textContent=item.title||item.name||'（タイトルなし）';title.style.cssText='display:block;font-size:13px;line-height:1.4';
      const meta=document.createElement('span');let dateLabel='日付未設定';if(/^\d{4}-\d{2}-\d{2}$/.test(item.date||'')){const d=new Date(item.date+'T12:00:00');dateLabel=(d.getMonth()+1)+'月'+d.getDate()+'日（'+['日','月','火','水','木','金','土'][d.getDay()]+'）'}
      const timeLabel=/^\d{2}:\d{2}$/.test(item.time||'')?item.time+' · ':'';meta.textContent=timeLabel+dateLabel+' · '+(item.category==='task'?'タスク':item.category==='reminder'?'リマインダー':'予定')+(item.note?' · '+item.note:'');meta.style.cssText='display:block;margin-top:4px;color:#778079;font-size:11px;line-height:1.5';
      button.append(title,meta);button.onmousedown=event=>event.preventDefault();button.onclick=()=>selectResult(results[Number(button.dataset.index)]);popup.append(button)
    }
    popup.style.display='block'
  }
  function applySmartFilter(){
    const value=search.value.trim();if(!value)return;
    const plan=planFor(value);
    document.querySelectorAll('.day').forEach(day=>{
      const has=[...day.querySelectorAll('.event')].some(node=>matches({title:node.textContent,date:day.dataset.date},plan));
      day.style.opacity=has?'':'0.2'
    });
    document.querySelectorAll('.agenda-row').forEach(row=>{row.style.display=matches({title:row.textContent},plan)?'':'none'});
  }
  search.addEventListener('input',()=>{renderResults();applySmartFilter()});
  search.addEventListener('focus',renderResults);
  search.addEventListener('keydown',event=>{if(event.key==='Escape'){popup.style.display='none';search.blur()}});
  document.addEventListener('click',event=>{if(!controls.contains(event.target))popup.style.display='none'});
  const observer=new MutationObserver(()=>{if(search.value.trim())applySmartFilter()});
  observer.observe($('#days'),{childList:true});observer.observe($('#agendaList'),{childList:true});
  function selectResult(item){
    popup.style.display='none';
    if(item._source==='task'&&!item.date){$('#taskList')?.scrollIntoView({behavior:'smooth',block:'center'});return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(item.date||'')){return}
    const target=new Date(item.date+'T12:00:00'),wanted=target.getFullYear()*12+target.getMonth();
    for(let i=0;i<36;i++){
      const match=($('#monthTitle')?.textContent||'').match(/(\d{4})年\s*(\d{1,2})月/);if(!match)break;
      const current=Number(match[1])*12+Number(match[2])-1,diff=wanted-current;if(!diff)break;
      (diff>0?$('#nextMonth'):$('#prevMonth'))?.click()
    }
    document.querySelector('.day[data-date="'+item.date+'"]')?.click();
    setTimeout(()=>{
      const agenda=$('#agendaList'),row=[...agenda.querySelectorAll('.agenda-row')].find(node=>normalize(node.textContent).includes(normalize(item.title||item.name||'')));
      agenda.scrollIntoView({behavior:'smooth',block:'start'});
      if(row){row.style.outline='2px solid #74a88c';row.style.outlineOffset='2px';setTimeout(()=>{row.style.outline='';row.style.outlineOffset=''},1800)}
      applySmartFilter()
    },60)
  }
})();
</script></body></html>
